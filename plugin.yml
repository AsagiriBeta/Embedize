name: Embedize
version: '1.0.0'
main: com.embedize.EmbedizePlugin
api-version: '1.21'
folia-supported: true
authors: [Embedize]
description: Isolate datapack structure generation (e.g. Dungeons and Taverns) to configured Multiverse worlds.
softdepend: [Multiverse-Core, TerraformGenerator]
commands:
  embedize:
    description: Embedize admin commands
    usage: /embedize <reload|status|worlds|install|allow|deny>
    permission: embedize.admin
    aliases: [emb, ez]
permissions:
  embedize.admin:
    description: Administer Embedize
    default: op
