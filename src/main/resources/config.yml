# Embedize
#
# Place structure datapacks yourself in the world datapacks folder.
# This plugin only isolates their natural generation via groups (groups.yml).
# Vanilla minecraft: structures are never touched.

enabled: true

# If a structure namespace is not in any group:
#   false = leave alone (PASS)
#   true  = deny in all worlds
manage-ungrouped: false

deny-unresolved-structure-keys: false
debug-cancellations: false

datapacks:
  # Optional: install a small TFG biome-tag bridge from this plugin's jar
  # (not a third-party structure pack). Disable if unused.
  install-tfg-bridge: true
  install-directory: default-world

multiverse:
  resolve-aliases: true
