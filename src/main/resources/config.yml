# Embedize
#
# Datapack structures are managed via groups (see groups.yml).
# Each group has its own namespaces + allowed-worlds whitelist.
# Vanilla minecraft: structures are never touched.

enabled: true

# If a structure namespace is not in any group:
#   false = leave alone (PASS)
#   true  = deny in all worlds
manage-ungrouped: false

deny-unresolved-structure-keys: false
debug-cancellations: false

datapacks:
  install-tfg-bridge: true
  install-directory: default-world

  # Multiple structure datapacks can be listed here (Modrinth download / install).
  # Link them to a group id from groups.yml via "group".
  sources:
    dungeons-and-taverns:
      enabled: true
      type: modrinth
      modrinth-project: dungeons-and-taverns
      prefer-datapack-zip: true
      namespaces:
        - nova_structures
      group: dungeons

multiverse:
  resolve-aliases: true
