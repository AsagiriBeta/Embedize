# Embedize — whitelist isolation for structure datapacks
#
# Managed structures naturally generate ONLY in allowed-worlds.
# All other worlds are denied. Manual /place is unaffected.

enabled: true

# Worlds that MAY receive managed structure datapacks.
# Example: only "resource" → default "world" gets nothing.
allowed-worlds:
  - resource

# Which structures are managed:
#   ALL_NON_MINECRAFT — all non-vanilla namespaces (recommended)
#   NAMESPACES        — only the listed namespaces
#   ALL               — including vanilla minecraft: structures
structure-filter:
  mode: ALL_NON_MINECRAFT
  namespaces:
    - nova_structures

# If a structure key cannot be resolved, deny placement (fail-closed).
deny-unresolved-structure-keys: true

# Verbose per-structure allow/deny logging (spammy on busy servers).
debug-cancellations: false

# --- Optional datapack installers (DnT is one preset; more can be added later) ---
datapacks:
  install-tfg-bridge: true

  dungeons-and-taverns:
    enabled: true
    install: auto
    modrinth-project: dungeons-and-taverns
    prefer-datapack-zip: true
    # pinned-version: "5.3.0"

  install-directory: default-world

multiverse:
  resolve-aliases: true
