# Embedize structure groups
# Place structure datapacks in the world datapacks folder yourself.
# packs = labels (for your own bookkeeping / commands)
# namespaces = structure namespaces used for isolation
# allowed-worlds = per-group whitelist

groups:
  dungeons:
    display-name: Dungeons and Taverns
    packs:
      - dungeons-and-taverns
    namespaces:
      - nova_structures
    allowed-worlds:
      - resource

  towns:
    display-name: Towns and Towers
    packs:
      - towns-and-towers
    namespaces:
      - towns_and_towers
    allowed-worlds:
      - resource
