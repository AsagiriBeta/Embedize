name: Embedize
version: '${version}'
main: com.embedize.EmbedizePlugin
api-version: '1.21'
folia-supported: true
authors: [Embedize]
description: GPLv3 Java terrain + vanilla structure engine (Embedize / Embedize:nether / Embedize:end).
softdepend: [Multiverse-Core, LuckPerms, WorldEdit, PlaceholderAPI]
commands:
  embedize:
    description: Embedize admin commands
    usage: /embedize <reload|status|worlds|packs|gens|border|place|reset|help>
    permission: embedize.admin
    aliases: [emb, ez]
  resreset:
    description: Manually reset the resource world
    usage: /resreset [reason]
    permission: embedize.command.reset
  resresetstatus:
    description: Show resource world reset status
    usage: /resresetstatus
    permission: embedize.command.reset
  resresetunlock:
    description: Force-clear the resource world reset lock
    usage: /resresetunlock
    permission: embedize.command.reset
permissions:
  embedize.admin:
    description: Full Embedize administration
    default: op
    children:
      embedize.border.admin: true
      embedize.command.reload: true
      embedize.command.status: true
      embedize.command.place: true
      embedize.command.reset: true
  embedize.border.admin:
    description: Manage invisible world borders
    default: op
  embedize.border.bypass:
    description: Bypass invisible world borders
    default: false
  embedize.command.reload:
    description: Reload Embedize
    default: op
  embedize.command.status:
    description: View Embedize status
    default: op
  embedize.command.place:
    description: Debug-place a single structure template
    default: op
  embedize.command.reset:
    description: Reset the resource world (manual / status / unlock)
    default: op
