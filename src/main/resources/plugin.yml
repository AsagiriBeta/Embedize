name: DimensionStructureIsolator
version: '${version}'
main: com.dsi.isolator.DimensionStructureIsolatorPlugin
api-version: '1.21'
folia-supported: true
authors: [DSI]
description: Isolate datapack structure generation (e.g. Dungeons and Taverns) to configured Multiverse worlds.
softdepend: [Multiverse-Core, TerraformGenerator]
commands:
  dsi:
    description: DimensionStructureIsolator admin commands
    usage: /dsi <reload|status|worlds|install|allow|deny>
    permission: dsi.admin
    aliases: [dimensionstructureisolator, structisolate]
permissions:
  dsi.admin:
    description: Administer DimensionStructureIsolator
    default: op
